<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonte Tabala Mangala — Ingénieur Logiciel</title>
    <meta name="description" content="Portfolio de Bonte Tabala Mangala, ingénieur logiciel full-stack." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Chargement des polices en mode NON bloquant : si fonts.googleapis.com
      est lent ou mal joignable depuis certains réseaux, la page s'affiche
      quand même immédiatement (avec une police de secours), puis bascule
      sur les vraies polices dès qu'elles arrivent. Sans ce mécanisme, le
      navigateur laisse la page blanche tant que ce fichier CSS externe
      n'est pas chargé.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <!--
      Écran de chargement en pur HTML/CSS : il s'affiche INSTANTANÉMENT,
      avant même que le bundle JS ou les polices Google soient arrivés.
      main.tsx le fait disparaître en fondu une fois React monté.
    -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #060b12;
        background-image:
          linear-gradient(rgba(79, 227, 214, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 227, 214, 0.09) 1px, transparent 1px);
        background-size: 42px 42px;
        font-family: "Courier New", monospace;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-loader .bl-mark {
        width: 56px;
        height: 56px;
        border: 1.5px solid #4fe3d6;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #4fe3d6;
        font-size: 15px;
        letter-spacing: 2px;
        position: relative;
      }
      #boot-loader .bl-mark::before {
        content: "";
        position: absolute;
        inset: -6px;
        border: 1px solid rgba(79, 227, 214, 0.3);
        animation: bl-spin 2.2s linear infinite;
      }
      @keyframes bl-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      #boot-loader .bl-text {
        color: #8ff2e8;
        font-size: 11px;
        letter-spacing: 3px;
      }
      #boot-loader .bl-bar {
        width: 160px;
        height: 2px;
        background: rgba(79, 227, 214, 0.15);
        overflow: hidden;
      }
      #boot-loader .bl-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #4fe3d6;
        animation: bl-sweep 1.3s ease-in-out infinite;
      }
      @keyframes bl-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader">
      <div class="bl-mark">BT</div>
      <div class="bl-bar"></div>
      <div class="bl-text">INITIALISATION DU SYSTÈME…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
